<!DOCTYPE html>
<html lang="is">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markorð 61 - 70</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #f0f4f8; 
            margin: 0;
            padding: 2vh 5vw; 
            min-height: 95vh; 
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .container { 
            width: 100%; 
            max-width: 1200px; 
            background: white; 
            padding: 30px 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            max-height: 100%;
            overflow-y: auto;
        }
        h1 {
            color: #1a73e8;
            font-size: 2em;
            margin-top: 0;
            margin-bottom: 15px;
        }
        /* Framvindustika */
        .progress-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
            height: 20px;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background-color: #34a853;
            border-radius: 10px;
            transition: width 0.5s ease-in-out;
        }
        
        #target { 
            font-size: 4em; 
            margin: 10px 0; 
            color: #222; 
            font-weight: bold;
        }
        
        #is-explanation {
            font-size: 1.3em;
            color: #333;
            background-color: #e8f0fe;
            padding: 15px 25px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 20px;
            max-width: 80%;
            line-height: 1.6;
        }

        .btn { 
            padding: 12px 25px; 
            font-size: 1.2em; 
            margin: 5px; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            background-color: #1a73e8; 
            color: white; 
            transition: 0.3s; 
            font-weight: bold;
        }
        .btn:hover:not(:disabled) { background-color: #1557b0; transform: scale(1.02); }
        .recording { background-color: #d93025; animation: pulse 1.5s infinite; }
        .recording:hover { background-color: #b3140b; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #media-box { 
            font-size: 1.05em; 
            color: #444; 
            text-align: left; 
            background: #f8fbff; 
            padding: 15px 30px; 
            border-radius: 12px; 
            line-height: 1.8; 
            border-left: 6px solid #1a73e8; 
            margin-top: 15px;
            display: inline-block;
            min-width: 70%;
        }
        #spoken {
            margin-top: 15px; 
            font-size: 1.4em;
            font-style: italic; 
            color: #555;
        }
        #result {
            font-weight: bold; 
            font-size: 1.8em; 
            margin-top: 5px; 
            color: #1a73e8;
        }
        .nav-btns { margin-top: 20px; }
        #counter { font-size: 1.2em; color: #666; font-weight: bold; margin-bottom: 10px; }
        
        /* Fyrir nafnainnslátt */
        #studentName {
            font-size: 1.5em;
            padding: 10px;
            margin: 20px 0;
            width: 80%;
            max-width: 400px;
            border: 2px solid #1a73e8;
            border-radius: 8px;
            text-align: center;
        }

        .feedback-note {
            margin-top: 40px;
            font-size: 0.95em;
            color: #555;
            padding-top: 15px;
            border-top: 1px solid #ddd;
        }
        .feedback-note a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: bold;
        }
        .feedback-note a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <h1>Markorð 61 - 70</h1>
    
    <div class="progress-container">
        <div id="progress-bar"></div>
    </div>

    <div id="counter"></div>
    
    <div id="target"></div>
    <div id="is-explanation"></div>
    <br>
    <button id="record-btn" class="btn" onclick="toggleRecord()">🎤 Tala</button>
    
    <div id="spoken"></div>
    <div id="result"></div>

    <div id="media-box"></div>

    <div class="nav-btns">
        <button class="btn" style="background-color: #5f6368;" onclick="prevExercise()">⬅️ Fyrri</button>
        <button class="btn" style="background-color: #5f6368;" onclick="nextExercise()">Næsta ➡️</button>
    </div>

    <div class="feedback-note">
        Þetta er tilraunaútgáfa. Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
    </div>
</div>

<script>
const exerciseData = [
    { 
        text: "vel", 
        is_exp: "<b>Útskýring:</b> Atviksorð sem þýðir að gera eitthvað á góðan eða réttan hátt. Andheiti: <i>illa</i>.<br><b>Dæmi:</b> Hann spilar mjög <b>vel</b>.",
        translations: "<b>Enska (English):</b> Explanation: Adverb meaning to do something in a good or correct way (well). Antonym: illa (badly). Example: He plays very <b>well</b>.<br>" +
                      "<b>Pólska (Polski):</b> Objaśnienie: Przysłówek oznaczający robienie czegoś w dobry lub właściwy sposób (dobrze). Antonim: illa (źle). Przykład: On gra bardzo <b>dobrze</b>.<br>" +
                      "<b>Spænska (Español):</b> Explicación: Adverbio que significa hacer algo de buena o correcta manera (bien). Antónimo: illa (mal). Ejemplo: Él juega muy <b>bien</b>.<br>" +
                      "<b>Víetnamska (Tiếng Việt):</b> Giải thích: Trạng từ có nghĩa là làm việc gì đó một cách tốt hoặc đúng (tốt/giỏi). Từ trái nghĩa: illa (tệ). Ví dụ: Anh ấy chơi rất <b>giỏi</b>.<br>" +
                      "<b>Arabíska (العربية):</b> الشرح: ظرف يعني القيام بشيء بطريقة جيدة أو صحيحة (جيداً). مضاد: illa (بشكل سيء). مثال: هو يلعب بشكل <b>جيد</b> جداً.<br>" +
                      "<b>Rússneska (Русский):</b> Объяснение: Наречие, означающее делать что-то хорошим или правильным образом (хорошо). Антоним: illa (плохо). Пример: Он играет очень <b>хорошо</b>.<br>" +
                      "<b>Úkraínska (Українська):</b> Пояснення: Прислівник, що означає робити щось у хороший або правильний спосіб (добре). Антонім: illa (погано). Приклад: Він грає дуже <b>добре</b>.<br>" +
                      "<b>Persneska (فارسی):</b> توضیح: قید به معنی انجام کاری به روش خوب یا درست (خوب). متضاد: illa (بد). مثال: او خیلی <b>خوب</b> بازی می‌کند.<br>" +
                      "<b>Tælenska (ไทย):</b> คำอธิบาย: กริยาวิเศษณ์หมายถึงทำบางสิ่งด้วยวิธีที่ดีหรือถูกต้อง (ดี) คำตรงข้าม: illa (แย่) ตัวอย่าง: เขาเล่นได้<b>ดี</b>มาก<br>" +
                      "<b>Portúgalska (Português):</b> Explicativo: Advérbio que significa fazer algo de maneira boa ou correta (bem). Antônimo: illa (mal). Exemplo: Ele joga muito <b>bem</b>.<br>" +
                      "<b>Kínverska (中文):</b> 解释：副词，意思是把某事做得很好或正确（好）。反义词：illa（糟糕）。 例句：他玩得（或弹得）很<b>好</b>。<br>" +
                      "<b>Lettneska (Latviešu):</b> Paskaidrojums: Apstākļa vārds, kas nozīmē kaut ko darīt labā vai pareizā veidā (labi). Antonīms: illa (slikti). Piemērs: Viņš spēlē ļoti <b>labi</b>."
    },
    { 
        text: "hvaða", 
        is_exp: "<b>Útskýring:</b> Spurnarfornafn sem er notað til að spyrja um tegund, hlut eða val.<br><b>Dæmi:</b> <b>Hvaða</b> litur er þetta?",
        translations: "<b>Enska (English):</b> Explanation: Question word used to ask about a type, object, or choice (which/what). Example: <b>What</b> color is this?<br>" +
                      "<b>Pólska (Polski):</b> Objaśnienie: Zaimek pytający używany do pytania o rodzaj, rzecz lub wybór (jaki/który). Przykład: <b>Jaki</b> to kolor?<br>" +
                      "<b>Spænska (Español):</b> Explicación: Pronombre interrogativo usado para preguntar sobre un tipo, objeto o elección (qué/cuál). Ejemplo: ¿<b>Qué</b> color es este?<br>" +
                      "<b>Víetnamska (Tiếng Việt):</b> Giải thích: Từ để hỏi dùng để hỏi về loại, đồ vật hoặc sự lựa chọn (nào/gì). Ví dụ: Đây là màu <b>gì</b>?<br>" +
                      "<b>Arabíska (العربية):</b> الشرح: أداة استفهام تستخدم للسؤال عن نوع، شيء، أو اختيار (أي/ما). مثال: <b>أي</b> لون هذا؟<br>" +
                      "<b>Rússneska (Русский):</b> Объяснение: Вопросительное местоимение, используемое для вопроса о типе, предмете или выборе (какой). Пример: <b>Какой</b> это цвет?<br>" +
                      "<b>Úkraínska (Українська):</b> Пояснення: Питальний займенник, що використовується для запитання про тип, предмет або вибір (який). Приклад: <b>Який</b> це колір?<br>" +
                      "<b>Persneska (فارسی):</b> توضیح: کلمه پرسشی که برای پرسیدن درباره نوع، شیء یا انتخاب استفاده می‌شود (کدام/چه). مثال: این <b>چه</b> رنگی است؟<br>" +
                      "<b>Tælenska (ไทย):</b> คำอธิบาย: คำถามที่ใช้เพื่อถามเกี่ยวกับประเภท สิ่งของ หรือตัวเลือก (อันไหน/อะไร) ตัวอย่าง: นี่สี<b>อะไร</b>?<br>" +
                      "<b>Portúgalska (Português):</b> Explicativo: Pronome interrogativo usado para perguntar sobre um tipo, objeto ou escolha (qual/que). Exemplo: <b>Que</b> cor é essa?<br>" +
                      "<b>Kínverska (中文):</b> 解释：用于询问类型、物体或选择的疑问词（哪一个/什么）。 例句：这是<b>什么</b>颜色？<br>" +
                      "<b>Lettneska (Latviešu):</b> Paskaidrojums: Jautājuma vārds, ko izmanto, lai jautātu par veidu, priekšmetu vai izvēli (kāds/kurš). Piemērs: <b>Kāds</b> krāsa tas ir?"
    },
    { 
        text: "inn", 
        is_exp: "<b>Útskýring:</b> Atviksorð sem vísar til hreyfingar eða stefnu inn í eitthvað rými. Andheiti: <i>út</i>.<br><b>Dæmi:</b> Komdu <b>inn</b> í húsið.",
        translations: "<b>Enska (English):</b> Explanation: Adverb indicating movement or direction into a space (inside/in). Antonym: út (out). Example: Come <b>inside</b> the house.<br>" +
                      "<b>Pólska (Polski):</b> Objaśnienie: Przysłówek wskazujący ruch lub kierunek do wnętrza (do środka/w). Antonim: út (na zewnątrz). Przykład: Chodź <b>do</b> domu (do środka).<br>" +
                      "<b>Spænska (Español):</b> Explicación: Adverbio que indica movimiento o dirección hacia un espacio (adentro/dentro). Antónimo: út (afuera). Ejemplo: Entra (ven <b>adentro</b>) a la casa.<br>" +
                      "<b>Víetnamska (Tiếng Việt):</b> Giải thích: Trạng từ chỉ sự di chuyển hoặc hướng vào một không gian (vào trong). Từ trái nghĩa: út (ra ngoài). Ví dụ: Hãy vào <b>trong</b> nhà.<br>" +
                      "<b>Arabíska (العربية):</b> الشرح: ظرف يشير إلى الحركة أو الاتجاه نحو مساحة ما (إلى الداخل). مضاد: út (إلى الخارج). مثال: تعال إلى <b>داخل</b> المنزل.<br>" +
                      "<b>Rússneska (Русский):</b> Объяснение: Наречие, указывающее на движение или направление внутрь пространства (внутрь/в). Антоним: út (наружу). Пример: Заходи <b>внутрь</b> (в дом).<br>" +
                      "<b>Úkraínska (Українська):</b> Пояснення: Прислівник, що вказує на рух або напрямок всередину простору (всередину). Антонім: út (назовні). Приклад: Заходь <b>всередину</b> (в будинок).<br>" +
                      "<b>Persneska (فارسی):</b> توضیح: قیدی که حرکت یا جهت به سمت یک فضا را نشان می‌دهد (داخل). متضاد: út (بیرون). مثال: بیا <b>داخل</b> خانه.<br>" +
                      "<b>Tælenska (ไทย):</b> คำอธิบาย: กริยาวิเศษณ์บอกการเคลื่อนไหวหรือทิศทางเข้าไปในพื้นที่ (ข้างใน/เข้า) คำตรงข้าม: út (ออก) ตัวอย่าง: เข้ามา<b>ข้างใน</b>บ้านสิ<br>" +
                      "<b>Portúgalska (Português):</b> Explicativo: Advérbio indicando movimento ou direção para dentro de um espaço (para dentro). Antônimo: út (para fora). Exemplo: Venha <b>para dentro</b> da casa.<br>" +
                      "<b>Kínverska (中文):</b> 解释：表示进入某空间的动作或方向的副词（里面/进入）。反义词：út（出去）。 例句：进到房子<b>里面</b>来。<br>" +
                      "<b>Lettneska (Latviešu):</b> Paskaidrojums: Apstākļa vārds, kas norāda uz kustību vai virzienu telpā (iekšā). Antonīms: út (ārā). Piemērs: Nāc <b>iekšā</b> mājā."
    },
    { 
        text: "árið", 
        is_exp: "<b>Útskýring:</b> Nafnorðið „ár“ (12 mánuðir) með ákveðnum greini. Oft notað þegar talað er um ákveðið ártal.<br><b>Dæmi:</b> Hún fæddist <b>árið</b> 2010.",
        translations: "<b>Enska (English):</b> Explanation: The noun 'ár' (year) with the definite article (the year). Often used when talking about a specific year. Example: She was born in <b>the year</b> 2010.<br>" +
                      "<b>Pólska (Polski):</b> Objaśnienie: Rzeczownik 'ár' (rok) z przedimkiem określonym (ten rok). Często używany, gdy mowa o konkretnym roku. Przykład: Urodziła się w <b>roku</b> 2010.<br>" +
                      "<b>Spænska (Español):</b> Explicación: El sustantivo 'ár' (año) con artículo definido (el año). A menudo se usa al hablar de un año específico. Ejemplo: Ella nació en <b>el año</b> 2010.<br>" +
                      "<b>Víetnamska (Tiếng Việt):</b> Giải thích: Danh từ 'ár' (năm) với mạo từ xác định. Thường dùng khi nói về một năm cụ thể. Ví dụ: Cô ấy sinh <b>năm</b> 2010.<br>" +
                      "<b>Arabíska (العربية):</b> الشرح: اسم 'ár' (سنة) مع أداة التعريف (السنة / العام). غالباً ما يُستخدم عند الحديث عن سنة معينة. مثال: هي ولدت في <b>عام</b> 2010.<br>" +
                      "<b>Rússneska (Русский):</b> Объяснение: Существительное 'ár' (год) с определенным артиклем. Часто используется, когда речь идет о конкретном годе. Пример: Она родилась в 2010 <b>году</b>.<br>" +
                      "<b>Úkraínska (Українська):</b> Пояснення: Іменник 'ár' (рік) з означеним артиклем. Часто використовується, коли йдеться про конкретний рік. Приклад: Вона народилася у 2010 <b>році</b>.<br>" +
                      "<b>Persneska (فارسی):</b> توضیح: اسم «ár» (سال) با حرف تعریف معین. اغلب هنگام صحبت در مورد یک سال خاص استفاده می‌شود. مثال: او در <b>سال</b> ۲۰۱۰ به دنیا آمد.<br>" +
                      "<b>Tælenska (ไทย):</b> คำอธิบาย: คำนาม 'ár' (ปี) ในรูปแบบชี้เฉพาะ มักใช้เมื่อพูดถึงปีใดปีหนึ่ง ตัวอย่าง: เธอเกิดใน<b>ปี</b> 2010<br>" +
                      "<b>Portúgalska (Português):</b> Explicativo: O substantivo 'ár' (ano) com o artigo definido (o ano). Frequentemente usado ao falar sobre um ano específico. Exemplo: Ela nasceu no <b>ano</b> 2010.<br>" +
                      "<b>Kínverska (中文):</b> 解释：带有定冠词的名词“ár”（年）。常用于谈论具体年份时。 例句：她出生于2010<b>年</b>。<br>" +
                      "<b>Lettneska (Latviešu):</b> Paskaidrojums: Lietvārds 'ár' (gads) ar noteikto artikulu. Bieži tiek lietots, runājot par konkrētu gadu. Piemērs: Viņa dzimusi 2010. <b>gadā</b>."
    },
    { 
        text: "honum", 
        is_exp: "<b>Útskýring:</b> Fornafnið „hann“ í þágufalli. Oft notað eftir sagnorðum eins og „að hjálpa“ eða ákveðnum forsetningum.<br><b>Dæmi:</b> Ég hjálpaði <b>honum</b>.",
        translations: "<b>Enska (English):</b> Explanation: The pronoun 'hann' (he) in the dative case (him). Often used after verbs like 'to help' or certain prepositions. Example: I helped <b>him</b>.<br>" +
                      "<b>Pólska (Polski):</b> Objaśnienie: Zaimek 'hann' (on) w celowniku (jemu / mu). Często używany po czasownikach takich jak 'pomagać' lub po przyimkach. Przykład: Pomogłem <b>mu</b>.<br>" +
                      "<b>Spænska (Español):</b> Explicación: El pronombre 'hann' (él) en caso dativo (le / a él). Se usa a menudo después de verbos como 'ayudar' o ciertas preposiciones. Ejemplo: <b>Le</b> ayudé (a él).<br>" +
                      "<b>Víetnamska (Tiếng Việt):</b> Giải thích: Đại từ 'hann' (anh ấy) ở cách tặng (cho/giúp anh ấy). Thường dùng sau các động từ như 'giúp đỡ' hoặc giới từ. Ví dụ: Tôi đã giúp <b>anh ấy</b>.<br>" +
                      "<b>Arabíska (العربية):</b> الشرح: الضمير 'hann' (هو) في حالة الجر (له). يُستخدم غالباً بعد أفعال مثل 'يساعد' أو حروف جر معينة. مثال: أنا ساعدتـ<b>ـه</b>.<br>" +
                      "<b>Rússneska (Русский):</b> Объяснение: Местоимение 'hann' (он) в дательном падеже (ему). Часто используется после глаголов типа 'помогать' или предлогов. Пример: Я помог <b>ему</b>.<br>" +
                      "<b>Úkraínska (Українська):</b> Пояснення: Займенник 'hann' (він) у давальному відмінку (йому). Часто використовується після дієслів на зразок 'допомагати' або прийменників. Приклад: Я допоміг <b>йому</b>.<br>" +

let userScores = new Array(exerciseData.length).fill(null);
let userSpoken = new Array(exerciseData.length).fill("");

let currentIndex = 0;
let recognition;
let isRecording = false;
let autoAdvanceTimer = null;

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'is-IS';
    recognition.continuous = false;
    recognition.interimResults = false;
    
    // Slökkt sjálfkrafa þegar talningu eða þögn er lokið
    recognition.onend = () => {
        isRecording = false;
        const btn = document.getElementById('record-btn');
        if (btn) {
            btn.innerText = "🎤 Tala";
            btn.classList.remove('recording');
        }
        
        // Hreinsa stöðutexta ef ekkert orð fannst
        const resDiv = document.getElementById('result');
        if (resDiv && resDiv.innerText === "Hlusta...") {
            resDiv.innerText = "";
        }
    };
} else {
    alert("Þessi vafri styður ekki talgreiningu. Notaðu Chrome eða Edge á tölvu.");
}

window.onload = () => { 
    updateUI(); 
};

function updateProgress() {
    let correctCount = 0;
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] === 100) {
            correctCount++;
        }
    }
    const percent = (correctCount / exerciseData.length) * 100;
    document.getElementById('progress-bar').style.width = percent + '%';
    return correctCount;
}

function findNextUnfinished() {
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] !== 100) {
            currentIndex = i;
            break;
        }
    }
    document.getElementById('app').innerHTML = `
        <h1>Markorð 61 - 70</h1>
        <div class="progress-container"><div id="progress-bar"></div></div>
        <div id="counter"></div>
        <div id="target"></div>
        <div id="is-explanation"></div>
        <br>
        <button id="record-btn" class="btn" onclick="toggleRecord()">🎤 Tala</button>
        <div id="spoken"></div>
        <div id="result"></div>
        <div id="media-box"></div>
        <div class="nav-btns">
            <button class="btn" style="background-color: #5f6368;" onclick="prevExercise()">⬅️ Fyrri</button>
            <button class="btn" style="background-color: #5f6368;" onclick="nextExercise()">Næsta ➡️</button>
        </div>
        <div class="feedback-note">
            Þetta er tilraunaútgáfa. Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
        </div>
    `;
    updateUI();
}

function updateUI() {
    clearTimeout(autoAdvanceTimer); 
    const correctCount = updateProgress();

    if (currentIndex >= exerciseData.length) {
        if (correctCount === exerciseData.length) {
            document.getElementById('app').innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: 100%;"></div></div>
                <h1 style="color: #34a853; font-size: 2.5em;">Frábært! Þú náðir 100% árangri! 🎉</h1>
                <p style="font-size: 1.2em; color: #555;">Skrifaðu nafnið þitt hér að neðan til að sækja viðurkenningarskjalið þitt.</p>
                <input type="text" id="studentName" placeholder="Skrifaðu nafnið þitt hér" autocomplete="off"><br>
                <button id="cert-btn" class="btn" style="background-color: #1a73e8; font-size: 1.5em; padding: 15px 30px; margin-top: 10px;" onclick="downloadCert()">🏆 Sækja viðurkenningarskjal</button>
                <br><br>
                <button class="btn" style="background-color: #5f6368;" onclick="location.reload()">🔄 Byrja aftur</button>
                <div class="feedback-note">
                    Þetta er tilraunaútgáfa. Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
                </div>
            `;
        } else {
            document.getElementById('app').innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: ${(correctCount/exerciseData.length)*100}%;"></div></div>
                <h1 style="color: #fbbc05; font-size: 2em;">Þú ert næstum því búin(n)!</h1>
                <p style="font-size: 1.2em;">Þú hefur klárað ${correctCount} af ${exerciseData.length} orðum með 100% árangri.</p>
                <p style="font-size: 1.1em; color: #555;">Farðu til baka og reyndu aftur við þau orð sem vantaði upp á til að fá skjalið.</p>
                <button class="btn" style="background-color: #fbbc05; color: #000;" onclick="findNextUnfinished()">➡️ Fara á orð sem vantar</button>
                <div class="feedback-note">
                    Þetta er tilraunaútgáfa. Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
                </div>
            `;
        }
        return;
    }

    const curr = exerciseData[currentIndex];
    document.getElementById('target').innerHTML = curr.text;
    document.getElementById('is-explanation').innerHTML = curr.is_exp;
    document.getElementById('counter').innerText = `Orð ${currentIndex + 1} af ${exerciseData.length}`;
    document.getElementById('media-box').innerHTML = curr.translations;

    const savedScore = userScores[currentIndex];
    const savedText = userSpoken[currentIndex];

    if (savedScore !== null) {
        document.getElementById('result').innerText = `Einkunn: ${savedScore}%`;
        document.getElementById('spoken').innerText = `Þú sagðir: "${savedText}"`;
    } else {
        document.getElementById('result').innerText = "";
        document.getElementById('spoken').innerText = "";
    }
}

function nextExercise() {
    currentIndex++;
    updateUI();
}

function prevExercise() {
    if (currentIndex > 0) {
        currentIndex--;
        updateUI();
    }
}

function toggleRecord() {
    if (!recognition) return;

    const btn = document.getElementById('record-btn');
    if (isRecording) {
        recognition.stop();
    } else {
        try {
            recognition.start();
            isRecording = true;
            btn.innerText = "🛑 Hlusta...";
            btn.classList.add('recording');
            document.getElementById('result').innerText = "Hlusta...";
            document.getElementById('spoken').innerText = "";
        } catch(e) {
            console.log("Villa í upptöku: " + e);
        }
    }
}

if (recognition) {
    recognition.onresult = (event) => {
        let spoken = event.results[0][0].transcript;
        spoken = spoken.trim().toLowerCase(); 

        document.getElementById('spoken').innerText = `Þú sagðir: "${spoken}"`;
        
        const targetWord = exerciseData[currentIndex].text.toLowerCase();
        
        let score = (spoken === targetWord) ? 100 : 0;
        
        if (spoken.replace(/[.,/#!$%^&*;:{}=\-_`~()]/g,"").trim() === targetWord) {
            score = 100;
        }
        
        document.getElementById('result').innerText = `Einkunn: ${score}%`;

        userScores[currentIndex] = score;
        userSpoken[currentIndex] = spoken;
        
        updateProgress();

        if (score === 100) {
            autoAdvanceTimer = setTimeout(() => {
                nextExercise();
            }, 1000); // 1 sekúndu bið
        }
    };
}

function downloadCert() {
    const studentNameInput = document.getElementById('studentName');
    const studentName = studentNameInput ? studentNameInput.value.trim() : "";
    
    if (studentName === "") {
        alert("Vinsamlegast skrifaðu nafnið þitt fyrst!");
        return;
    }

    const canvas = document.createElement('canvas');
    canvas.width = 900;
    canvas.height = 600;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.strokeStyle = '#1a73e8';
    ctx.lineWidth = 15;
    ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

    ctx.strokeStyle = '#fbbc05';
    ctx.lineWidth = 5;
    ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);
    
    ctx.fillStyle = '#1a73e8';
    ctx.textAlign = 'center';
    ctx.font = 'bold 50px Arial';
    ctx.fillText('Viðurkenning', canvas.width / 2, 140);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('Þetta skjal staðfestir að', canvas.width / 2, 220);
    
    ctx.fillStyle = '#000000';
    ctx.font = 'bold 45px Arial';
    ctx.fillText(studentName, canvas.width / 2, 290);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('hefur lokið æfingunni með glæsibrag:', canvas.width / 2, 360);

    ctx.fillStyle = '#1a73e8';
    ctx.font = 'bold 26px Arial';
    ctx.fillText('Markorð 61 - 70', canvas.width / 2, 420);
    
    ctx.fillStyle = '#34a853';
    ctx.font = 'italic 28px Arial';
    ctx.fillText('Frábær árangur! Haltu áfram að æfa þig.', canvas.width / 2, 490);

    const dateString = new Date().toLocaleDateString('is-IS');
    ctx.fillStyle = '#666666';
    ctx.font = '18px Arial';
    ctx.fillText('Dagsetning: ' + dateString, canvas.width / 2, 540);
    
    const link = document.createElement('a');
    link.download = `Vidurkenning_${studentName.replace(/\s+/g, '_')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    
    // Slekkur á takkanum til að koma í veg fyrir mörg skjöl
    const btn = document.getElementById('cert-btn');
    if (btn) {
        btn.disabled = true;
        btn.innerText = "✅ Skjal sótt";
        btn.style.backgroundColor = "#5f6368";
        btn.style.cursor = "not-allowed";
        btn.style.opacity = "0.7";
    }
}
</script>
